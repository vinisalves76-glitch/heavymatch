name: HeavyMatch tests

on:
  push:
    branches:
      - feat/phase-2-performance
      - refactor/phase-3-business-modules
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  marketplace-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run automated tests
        run: npm test
